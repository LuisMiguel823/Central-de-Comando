name: Build and deploy to production

on:
  push:
    branches: [main]

env:
  # Nomes de imagem Docker têm que ser minúsculos — não dá pra usar
  # github.repository direto aqui porque o repo tem maiúsculas no nome.
  IMAGE: ghcr.io/luismiguel823/central-de-comando

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O driver padrão ("docker") não sabe exportar cache tipo "gha" — só o
      # driver docker-container (que este step ativa) sabe. Sem isso o build
      # falha com "Cache export is not supported for the docker driver" e o
      # push nunca acontece.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy no Servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # As variáveis de produção (SECRET_KEY, DB_*, BASE_URL, etc.) ficam
            # num arquivo só no servidor, fora do Git. Sem ele o container
            # subiria com defaults de dev (sem banco, senha admin123), então
            # aborta ANTES de derrubar o container atual.
            ENV_FILE=/opt/auth_npibrasil/.env.production
            test -f "$ENV_FILE" || { echo "Falta $ENV_FILE no servidor"; exit 1; }

            # A imagem é privada: o docker do servidor precisa estar logado no
            # ghcr.io pra dar pull (o registry cadastrado no Portainer não vale
            # pra comando docker rodado por SSH).
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull ghcr.io/luismiguel823/central-de-comando:latest
            docker stop auth_npibrasil || true
            docker rm auth_npibrasil || true
            # A aplicação escuta na 8000 dentro do container (não na 80).
            docker run -d --name auth_npibrasil --restart always \
              --env-file "$ENV_FILE" \
              -p 9137:8000 \
              ghcr.io/luismiguel823/central-de-comando:latest

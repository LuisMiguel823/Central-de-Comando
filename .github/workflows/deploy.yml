name: Build and deploy to production

on:
  push:
    branches: [main]

env:
  # Nomes de imagem Docker têm que ser minúsculos — não dá pra usar
  # github.repository direto aqui porque o repo tem maiúsculas no nome.
  IMAGE: ghcr.io/luismiguel823/central-de-comando

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O driver padrão ("docker") não sabe exportar cache tipo "gha" — só o
      # driver docker-container (que este step ativa) sabe. Sem isso o build
      # falha com "Cache export is not supported for the docker driver" e o
      # push nunca acontece.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # O Portainer (stack "from repository" com docker-compose.prod.yml) é quem
  # faz o deploy: ao receber este webhook ele dá pull na imagem nova do ghcr.io
  # e recria os containers. Roda DEPOIS do build (needs) — senão o Portainer
  # subiria a imagem :latest antiga, antes do push terminar.
  # A URL do webhook é um segredo (quem tem ela dispara redeploy): fica só no
  # secret PORTAINER_WEBHOOK_URL do GitHub, nunca escrita aqui no arquivo.
  notify-portainer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dispara redeploy no Portainer
        run: curl -fsS --retry 3 --retry-delay 5 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

name: Build and deploy to production

on:
  push:
    branches: [main]

env:
  # Nomes de imagem Docker têm que ser minúsculos — não dá pra usar
  # github.repository direto aqui porque o repo tem maiúsculas no nome.
  IMAGE: ghcr.io/luismiguel823/central-de-comando

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O driver padrão ("docker") não sabe exportar cache tipo "gha" — só o
      # driver docker-container (que este step ativa) sabe. Sem isso o build
      # falha com "Cache export is not supported for the docker driver" e o
      # push nunca acontece.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add servidor aos known_hosts
        run: ssh-keyscan -p 22 "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH (só puxa a imagem pronta, não builda no servidor)
        run: |
          ssh -p 22 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
          '

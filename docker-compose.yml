services:
  db:
    image: mysql:8.4
    container_name: central_comando_db
    # MySQL 8.4 removeu --default-authentication-plugin (caching_sha2_password já é o padrão)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-central_comando}
      MYSQL_USER: ${DB_USER:-central}
      MYSQL_PASSWORD: ${DB_PASSWORD:-central}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: central_comando_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # dentro da rede do compose o host do banco é "db"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-central_comando}
      DB_USER: ${DB_USER:-central}
      DB_PASSWORD: ${DB_PASSWORD:-central}
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./:/code
    command: >
      sh -c "python -m scripts.wait_for_db &&
             python -m scripts.seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  mysql-data:

# Sem "env_file" pra .env.production de propósito: esse arquivo nunca vai
# pro Git (tem segredo), e no Portainer ("stack from repository") o compose
# roda a partir de uma cópia interna do repo (/data/compose/<id>/) onde esse
# arquivo nunca vai existir fisicamente. Os valores abaixo (${VAR}) são
# resolvidos pelo próprio Docker Compose a partir do painel "Environment
# variables" da stack no Portainer (ou de um .env ao lado deste arquivo, se
# rodar via CLI com --env-file) — mesma técnica que o serviço "db" já usa.
# Preencha essas variáveis no Portainer com os valores de .env.production.example.
services:
  db:
    image: mysql:8.4
    container_name: central_comando_db_prod
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sem publicar porta pro host — só o container "app" fala com o banco,
    # via rede interna do compose (host "db").

  app:
    # Imagem pronta, publicada pelo GitHub Actions em ghcr.io — o servidor só
    # dá "docker compose pull", nunca builda nada aqui (sem git/pip/build
    # tools precisando estar instalados no host de produção).
    image: ghcr.io/luismiguel823/central-de-comando:latest
    container_name: central_comando_app_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # dentro da rede do compose o host do banco é "db", não localhost
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      BASE_URL: ${BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "9137:8001"

volumes:
  mysql-data:

# Sem "env_file" pra .env.production de propósito: esse arquivo nunca vai
# pro Git (tem segredo), e no Portainer ("stack from repository") o compose
# roda a partir de uma cópia interna do repo (/data/compose/<id>/) onde esse
# arquivo nunca vai existir fisicamente. Os valores abaixo (${VAR}) são
# resolvidos pelo próprio Docker Compose a partir do painel "Environment
# variables" da stack no Portainer (ou de um .env ao lado deste arquivo, se
# rodar via CLI com --env-file).
# Preencha essas variáveis no Portainer com os valores de .env.production.example.
#
# Banco externo (MySQL compartilhado da empresa, ex.: DB01 — mesmo servidor
# que já hospeda o atendimentonpi_db do MILVUS) em vez de um container MySQL
# próprio: sem serviço "db" aqui, o "app" se conecta direto via DB_HOST/
# DB_PORT/DB_NAME/DB_USER/DB_PASSWORD do painel da stack. O banco (ex.:
# autenticacaonpi_db) e o usuário com privilégio nele precisam já existir
# nesse servidor — o Alembic (rodado no boot do container, ver Dockerfile)
# só cria as TABELAS dentro do banco, não o banco em si.
services:
  app:
    # Imagem pronta, publicada pelo GitHub Actions em ghcr.io — o servidor só
    # dá "docker compose pull", nunca builda nada aqui (sem git/pip/build
    # tools precisando estar instalados no host de produção).
    image: ghcr.io/luismiguel823/central-de-comando:latest
    container_name: central_comando_app_prod
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      BASE_URL: ${BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "9137:8000"
